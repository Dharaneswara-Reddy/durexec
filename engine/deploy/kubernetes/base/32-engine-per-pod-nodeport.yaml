# One NodePort per engine pod, so a load generator running OUTSIDE the cluster
# can address a specific node.
#
# Why this is needed. The engine's node id is its in-cluster DNS name
# (durexec-0.durexec-hl), because PeerAddr builds a peer URL as
# "http://" + nodeID + port. That is correct inside the cluster and
# unresolvable from the host. The load generator maps node id to base URL so
# that load aimed at a shard reaches the node that OWNS that shard; without a
# per-pod address every request would go to whichever pod the shared NodePort
# happened to pick, and roughly half would be answered with a 409 and
# re-sent. That retry traffic is not part of the system under test, and it
# would be counted as offered load.
#
# The selector uses statefulset.kubernetes.io/pod-name, a label the
# StatefulSet controller sets on each pod. It is the only built-in label that
# distinguishes one replica from another.
apiVersion: v1
kind: Service
metadata:
  name: durexec-0-np
  namespace: durexec-lab
spec:
  type: NodePort
  selector:
    app: durexec
    statefulset.kubernetes.io/pod-name: durexec-0
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30081
---
apiVersion: v1
kind: Service
metadata:
  name: durexec-1-np
  namespace: durexec-lab
spec:
  type: NodePort
  selector:
    app: durexec
    statefulset.kubernetes.io/pod-name: durexec-1
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30082
