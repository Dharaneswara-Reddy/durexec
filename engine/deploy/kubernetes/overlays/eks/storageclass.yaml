# EKS creates NO default StorageClass. The base 20-postgres.yaml declares a
# volumeClaimTemplate with no storageClassName, so without this the PVC sits
# Pending for ever and PostgreSQL never starts -- a failure that looks like a
# slow rollout rather than a missing object.
#
# WaitForFirstConsumer, not Immediate: the volume must be created in the same
# availability zone as the pod that claims it. Immediate binding can place the
# volume in one AZ and the pod in another, and the pod then never schedules.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: durexec-gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
