apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: durexec-lab

resources:
  - ../../base
  - storageclass.yaml

patches:
  - path: placement.yaml
  - path: external-db.yaml
  # PostgreSQL runs on a dedicated EC2 host for this campaign, so the
  # in-cluster database must not start. Deleting rather than scaling to zero:
  # a scaled-down StatefulSet still owns its PVC, and that PVC holds an EBS
  # volume that bills all campaign while serving nothing.
  - target: { kind: StatefulSet, name: postgres }
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: { name: postgres, namespace: durexec-lab }
  - target: { kind: Service, name: postgres }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: postgres, namespace: durexec-lab }
  # The TEST-ONLY external-effect simulator is not part of this campaign (its
  # matrix runner is the Compose/minikube script). Inherited from the base it
  # carried the LOCAL tag durexec-extsimd:phase7, which EKS cannot pull, and no
  # nodeSelector, so it sat in ImagePullBackOff on an engine node for the whole
  # campaign. Removed rather than left broken.
  - target: { kind: Deployment, name: extsim }
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: extsim, namespace: durexec-lab }
  - target: { kind: Service, name: extsim }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: extsim, namespace: durexec-lab }
  - target: { kind: Service, name: extsim-np }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: extsim-np, namespace: durexec-lab }
