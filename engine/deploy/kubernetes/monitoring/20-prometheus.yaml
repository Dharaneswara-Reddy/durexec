apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: durexec-lab
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
# A NodePort as well as the ClusterIP, for the same reason the engine has one
# (base/31-engine-nodeport.yaml): `kubectl port-forward` binds to a single pod
# and dies with it, which silently truncated an earlier measurement. Experiment
# scripts query this port directly so that killing an engine pod cannot also
# kill the thing recording what happened.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-np
  namespace: durexec-lab
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: durexec-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  strategy:
    # Recreate, not RollingUpdate: two Prometheus pods would both be scraping
    # the engine during a rollout, which doubles the observer's load on the
    # system being measured at exactly the wrong moment.
    type: Recreate
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        # Forces a pod restart when the scrape config changes. Without this,
        # editing the ConfigMap leaves the running pod on the old config and
        # the next experiment silently measures the previous configuration —
        # the same class of mistake as a dashboard served from browser cache.
        config/checksum: "phase6-r1"
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Retention is deliberately short. These experiments last minutes,
            # results are exported to CSV as they run, and the TSDB is not the
            # system of record for anything. Capping both age and size means a
            # forgotten lab cannot fill the node's 17 GiB of ephemeral storage.
            - --storage.tsdb.retention.time=6h
            - --storage.tsdb.retention.size=512MB
            - --web.enable-lifecycle
            - --web.listen-address=0.0.0.0:9090
          ports:
            - name: http
              containerPort: 9090
          # Explicit limits, because an unbounded observer on a 3.7 GiB node
          # can evict the system under test and turn a capacity measurement
          # into a measurement of memory pressure. These are also the numbers
          # the monitoring-overhead section reports against.
          resources:
            requests:
              cpu: 50m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 450Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # emptyDir, not a PVC: the TSDB is disposable by design (see retention
        # above). A PVC would survive a lab teardown and let a stale series from
        # a previous commit be read back as if it belonged to this run.
        - name: data
          emptyDir:
            sizeLimit: 1Gi
