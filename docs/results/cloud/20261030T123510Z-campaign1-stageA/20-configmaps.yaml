- apiVersion: v1
  data:
    POSTGRES_DB: durexec
    POSTGRES_USER: durexec
    postgresql.conf: |
      listen_addresses = '*'
      max_connections = 250
      shared_buffers = 256MB
      synchronous_commit = on
      wal_level = replica
      # Transaction-duration visibility, required by spec section 2.2. Anything
      # slower than 200ms is logged with its statement.
      log_min_duration_statement = 200
      log_lock_waits = on
      log_checkpoints = on
      track_io_timing = on
      # pg_stat_statements gives per-query latency without a sidecar.
      shared_preload_libraries = 'pg_stat_statements'
      pg_stat_statements.track = all
  kind: ConfigMap
  metadata:
    annotations:
